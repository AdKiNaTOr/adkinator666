<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>нЕвеРный оТвееТ</title>
    <style media="screen">
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      html {
        background: url("Img/adkinator2.png")
      }

      * {
        font-family: sans-serif;

      }

      #form {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) translateY(-80px);
      }

      #form h1 {
        color: blue;
        font-size: 60px
      }

      #incorrect {
        transform: translateX(100px);
        animation: button 0.6s infinite alternate;
      }

      @keyframes button {

        from {
          color: #0388fc;
        }

        to {
          color: #0345fc;
          transform: scale(1.5) translateX(100px);
        }
      }

      #and {
        transform: translateX(200px);
        opacity: 0
      }

      #img {
        transform: scale(0.3)
      }

      #schtrafgame {
        font-family: "Press Start 2P", sans-serif;
        font-size: 20px;
        opacity: 0;
      }

      .makeVisible {
        animation: toVisible 0.5s 1 forwards;
      }

      @keyframes toVisible {

        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }

      }

      #button {
        font-size: 100px;
        transform: translateX(85px);
        background: #00b7ff;
        background: linear-gradient(90deg, rgba(0, 183, 255, 1) 0%, rgba(8, 255, 214, 1) 50%, rgba(0, 149, 255, 1) 100%);
        border: 1px solid #000000;
        border-radius: 10px;
        transition: transform 0.4s ease, border-radius 0.4s ease, background 0.4s ease;
        opacity: 0

      }

      #button:hover {
        transform: translateX(85px) scale(1.5);
        cursor: pointer;
        border-radius: 50px;
        background: #08FFD6;
        background: linear-gradient(90deg, rgba(8, 255, 214, 1) 0%, rgba(0, 149, 255, 1) 51%, rgba(8, 255, 214, 1) 100%);
      }
    </style>
  </head>
  <body>
    <div id="form">

        <h1 id="incorrect">Неверный ответ!!!</h1>
        <h1 id="and">И за это...</h1>
        <h1 id="schtrafgame">ШТРАФНАЯ ИГРА</h1>
        <button type="button" id="button"><a href="sthrafGame.html">Продолжать</a></button>

    </div>
    <script src="JS/main.js" charset="utf-8"></script>
  </body>
</html>
